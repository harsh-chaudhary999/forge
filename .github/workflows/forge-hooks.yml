name: forge-hooks

on:
  push:
    paths:
      - "scripts/install.sh"
      - "scripts/forge-doctor.sh"
      - "hooks/hooks.json"
      - ".claude/hooks/session-start.cjs"
      - ".claude/hooks/pre-tool-use.cjs"
      - ".claude/hooks/post-commit.cjs"
      - ".claude/hooks/prompt-submit.cjs"
      - ".claude/hooks/prompt-submit-gates.cjs"
      - ".claude/hooks/prompt-submit-injection.cjs"
      - ".claude/hooks/forge-stage-detect.cjs"
      - ".claude/hooks/test-forge-stage-detect.cjs"
      - ".claude/hooks/pre-commit.cjs"
      - ".claude/hooks/pre-merge.cjs"
      - ".claude/hooks/commit-msg.cjs"
      - ".claude/hooks/post-merge.cjs"
      - ".claude/hooks/post-rewrite.cjs"
      - ".claude/hooks/forge-install-hooks.cjs"
      - ".claude/hooks/forge-worktree-cleanup.cjs"
      - ".claude/hooks/post-pr-dreamer.cjs"
      - "tools/**/*.py"
      - "tools/verify/**"
      - "tools/scan/**"
      - "tools/dev/**"
      - "tools/ops/**"
      - "tools/js/**"
      - "tools/scan_forge/**"
      - ".github/workflows/forge-hooks.yml"
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/forge-doctor.sh"
      - "hooks/hooks.json"
      - ".claude/hooks/session-start.cjs"
      - ".claude/hooks/pre-tool-use.cjs"
      - ".claude/hooks/post-commit.cjs"
      - ".claude/hooks/prompt-submit.cjs"
      - ".claude/hooks/prompt-submit-gates.cjs"
      - ".claude/hooks/prompt-submit-injection.cjs"
      - ".claude/hooks/forge-stage-detect.cjs"
      - ".claude/hooks/test-forge-stage-detect.cjs"
      - ".claude/hooks/pre-commit.cjs"
      - ".claude/hooks/pre-merge.cjs"
      - ".claude/hooks/commit-msg.cjs"
      - ".claude/hooks/post-merge.cjs"
      - ".claude/hooks/post-rewrite.cjs"
      - ".claude/hooks/forge-install-hooks.cjs"
      - ".claude/hooks/forge-worktree-cleanup.cjs"
      - ".claude/hooks/post-pr-dreamer.cjs"
      - "tools/**/*.py"
      - "tools/verify/**"
      - "tools/scan/**"
      - "tools/dev/**"
      - "tools/ops/**"
      - "tools/js/**"
      - "tools/scan_forge/**"
      - ".github/workflows/forge-hooks.yml"

jobs:
  stage-detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install script bash syntax
        run: bash -n scripts/install.sh

      - name: forge-doctor script bash syntax
        run: bash -n scripts/forge-doctor.sh

      - name: forge_evidence_bundle.py syntax
        run: python3 -m py_compile tools/ops/forge_evidence_bundle.py

      - name: forge_brain_mcp.py syntax + protocol smoke
        run: |
          python3 -m py_compile tools/mcp/forge_brain_mcp.py tools/forge_brain_mcp.py
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | python3 tools/forge_brain_mcp.py | python3 -c "import sys,json; rs=[json.loads(l) for l in sys.stdin if l.strip()]; assert rs[0]['result']['serverInfo']['name']=='forge-brain', rs; assert len(rs[1]['result']['tools'])==5, rs; print('OK: forge-brain MCP responds with 5 tools')"

      - name: trajectory eval + OTel export syntax + smoke
        run: |
          python3 -m py_compile tools/eval/forge_trajectory_eval.py tools/eval/forge_otel_export.py tools/forge_trajectory_eval.py tools/forge_otel_export.py
          T="$(mktemp -d)"; mkdir -p "$T/prds/demo"
          printf '%s\n' \
            '2026-06-18T10:00:00Z [P1-PRD-LOCKED] task_id=demo' \
            '2026-06-18T10:30:00Z [P2-SPEC-FROZEN] task_id=demo' \
            '2026-06-18T11:45:00Z [P4.0-SEMANTIC-EVAL] task_id=demo outcome=pass' \
            '2026-06-18T12:30:00Z [P4.1-DISPATCH] task_id=demo' \
            '2026-06-18T14:00:00Z [P4.3-REVIEW-PASS] task_id=demo' \
            '2026-06-18T14:30:00Z [P4.4-EVAL-PASS] task_id=demo outcome=GREEN' \
            > "$T/prds/demo/conductor.log"
          python3 tools/forge_trajectory_eval.py --task-id demo --brain "$T" --strict >/dev/null && echo "OK: trajectory eval (GREEN, strict)"
          python3 tools/forge_otel_export.py --task-id demo --brain "$T" | python3 -c "import sys,json; t=json.load(sys.stdin); assert t['resourceSpans'][0]['scopeSpans'][0]['spans']; print('OK: OTLP/JSON export')"

      - name: Stage marker unit tests
        run: node .claude/hooks/test-forge-stage-detect.cjs

      - name: Prompt submit gate resolution tests
        run: node tools/js/test-prompt-submit-gates.cjs

      - name: Prompt submit injection suppression tests
        run: node tools/js/test-prompt-submit-injection.cjs

      - name: Load prompt-submit gates module (syntax)
        run: node --check .claude/hooks/prompt-submit-gates.cjs

      - name: Load prompt-submit hook (syntax)
        run: node --check .claude/hooks/prompt-submit.cjs

      - name: Load prompt-submit-injection module (syntax)
        run: node --check .claude/hooks/prompt-submit-injection.cjs

      - name: Load session-start hook (syntax)
        run: node --check .claude/hooks/session-start.cjs

      - name: Load pre-tool-use hook (syntax)
        run: node --check .claude/hooks/pre-tool-use.cjs

      - name: Load post-commit hook (syntax)
        run: node --check .claude/hooks/post-commit.cjs

      - name: Load remaining hooks (syntax)
        run: |
          set -e
          for f in pre-commit pre-merge commit-msg post-merge post-rewrite \
                    forge-install-hooks forge-worktree-cleanup post-pr-dreamer; do
            node --check ".claude/hooks/${f}.cjs"
          done

  verify-forge-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional verify requirements (stdlib-only if empty)
        run: pip install -r tools/verify/requirements-verify.txt

      - name: verify_forge_task + tools/verify stdlib unit tests
        run: |
          set -e
          python3 -m unittest discover -s tools/verify -p "test_*.py" -v
          python3 -m unittest discover -s tools/dev -p "test_*.py" -v

  lint-skills-allowed-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: rigid skills must declare allowed-tools
        run: python3 tools/dev/lint_skill_allowed_tools.py

      - name: skill-tool-policy.json matches lint (no drift)
        run: |
          python3 tools/dev/lint_skill_allowed_tools.py --write-policy /tmp/skill-tool-policy.json
          diff -u tools/dev/skill-tool-policy.json /tmp/skill-tool-policy.json

      - name: skills + agents conform to the Agent Skills standard
        run: python3 tools/check_skill_standard.py
